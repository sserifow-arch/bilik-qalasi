.qq{font-size:21px;font-weight:800;line-height:1.3}

.opts.g2{grid-template-columns:1fr 1fr}
.opts.g3{grid-template-columns:1fr 1fr 1fr}
.opt{border:0;background:#fff;border-radius:20px;padding:16px 12px;font-weight:800;font-size:19px;cursor:pointer;box-shadow:0 5px 0 #d9ddf3;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25}

.opt .emo{font-size:46px;line-height:1}
.opt .num{font-size:30px;font-weight:900}

.opt.no{background:var(--bad);color:#fff;box-shadow:0 5px 0 #c7363b;animation:shake .45s}

@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.sw{display:inline-block;width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12);vertical-align:middle}

.fl3{display:inline-flex;flex-direction:column;width:84px;height:56px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.12)}

.fb{opacity:0;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,140%);background:#fff;border-radius:20px;padding:14px 22px;font-weight:900;font-size:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s ease,opacity .2s;max-width:92vw;text-align:center;z-index:5}

.fb.ok{color:#1e9e55}.fb.no{color:#c7363b}
.fb small{display:block;color:var(--ink);font-size:16px;margin-top:4px}
.res{text-align:center}
.res .big{font-size:66px;letter-spacing:6px;margin:6px 0}

.res .big span:nth-child(2){animation-delay:.2s}.res .big span:nth-child(3){animation-delay:.4s}

.res h2{font-size:26px;margin:4px 0 6px}
.res p{font-weight:800;color:var(--muted);margin:0 0 18px;font-size:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.2);padding:5px;border-radius:16px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:#fff;font-weight:800;padding:10px 4px;border-radius:12px;cursor:pointer;font-size:14.5px}

.lb-g{margin-bottom:14px}
.lb-g h3{font-size:17px;margin-bottom:10px;color:var(--blue)}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed #eef0fa}

.lrow .rk{width:34px;text-align:center;font-weight:900;font-size:20px}
.lrow .av{width:42px;height:42px;font-size:24px}
.lrow .nm{flex:1;font-weight:800}

.lrow.me{background:#fff7da;border-radius:12px}
.note{font-size:13.5px;color:var(--muted);font-weight:700;text-align:center;margin:10px 0 0}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:14px}

.seg{display:flex;gap:6px}

.hint{color:#fff;font-weight:800;text-align:center;margin:0 0 14px;opacity:.95}
.mem{display:grid;gap:10px}
.mc{aspect-ratio:1/1;border:0;padding:0;background:transparent;perspective:600px;cursor:pointer}

.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 rgba(0,0,0,.14)}

.mc.done .b{background:#d9f8e6}
.slide{position:relative;width:100%;max-width:400px;aspect-ratio:1/1;margin:0 auto;background:rgba(255,255,255,.35);border-radius:18px;padding:0;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.12)}

.pv{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:14px;color:#fff;font-weight:800}

.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall var(--t) linear forwards}

.small-link{background:none;border:0;color:#fff;font-weight:800;text-decoration:underline;cursor:pointer;margin:14px auto 0;display:block}

/* ================= generators ================= */
const tierOf=d=>d<=4?1:d<=10?2:3;
function poolGen(pool){return(r,d)=>{const T=tierOf(d);let c=pool.filter(x=>x.tier===T||x.tier===T-1);if(!c.length)c=pool.filter(x=>x.tier<=T);if(!c.length)c=pool;const x=pick(r,c);return{q:L(x.q),d:x.d||'',o:x.o.map(L)}}}
// colors
function gColName(r,d){const set=d<=3?BASIC:MID;const k=pick(r,set);return{q:L(TX.color),d:`<span class="sw big" style="background:${COL[k][0]}"></span>`,o:[k,...sample(r,set.filter(x=>x!==k),3)].map(x=>L(COL[x][1]))}}
function gFindCol(r,d){const set=d<=3?BASIC:MID;const k=pick(r,set);return{q:L(TX.findColor),d:`<div class="word">${L(COL[k][1])}</div>`,o:[k,...sample(r,set.filter(x=>x!==k),3)].map(sw)}}
function gObjCol(r,d){const[e,k]=pick(r,OBJ);return{q:L(TX.objColor),d:e,o:[k,...sample(r,MID.filter(x=>x!==k&&!(k==='gray'&&x==='white')&&!(k==='white'&&x==='gray')),3)].map(x=>L(COL[x][1]))}}
const MIX=[['red','yellow','orange'],['blue','yellow','green'],['red','blue','purple'],['red','white','pink'],['black','white','gray']];
function gMix(r,d){const[a,b,c]=pick(r,MIX);return{q:L(TX.mix),d:`${sw(a)} <b style="font-size:34px">+</b> ${sw(b)} <b style="font-size:34px">= ❓</b>`,o:[c,...sample(r,MID.filter(x=>x!==c&&x!==a&&x!==b),3)].map(sw)}}
// days
const day=i=>L(DAYS[((i%7)+7)%7]);
const dOpts=(r,c)=>[c,...sample(r,[0,1,2,3,4,5,6].filter(x=>x!==((c%7)+7)%7),3)].map(day);
function gNextDay(r){const i=ri(r,0,6);return{q:L(TX.nextDay),d:`<div class="word">${day(i)} ➜ ❓</div>`,o:dOpts(r,i+1)}}
function gPrevDay(r){const i=ri(r,0,6);return{q:L(TX.prevDay),d:`<div class="word">❓ ➜ ${day(i)}</div>`,o:dOpts(r,i-1)}}
function gWeekend(r){const w=ri(r,5,6);return{q:L(TX.weekend),d:'🏖️',o:[w,...sample(r,[0,1,2,3,4],3)].map(day)}}

function gSeq(r,d){const len=4;let arr=[],s=1,type=d<9?'add':d<13?pick(r,['add','sub']):pick(r,['add','sub','mul','grow']);
 if(type==='add'){s=d<9?ri(r,1,2):d<13?ri(r,2,5):ri(r,3,10);const a=ri(r,0,10);for(let i=0;i<=len;i++)arr.push(a+i*s)}
 if(type==='sub'){s=ri(r,2,5);const a=ri(r,s*len,s*len+20);for(let i=0;i<=len;i++)arr.push(a-i*s)}
 if(type==='mul'){s=pick(r,[2,3]);const a=ri(r,1,3);for(let i=0;i<=len;i++)arr.push(a*Math.pow(s,i))}
 if(type==='grow'){const a=ri(r,1,5);arr=[a];for(let i=1;i<=len;i++)arr.push(arr[i-1]+i)}
 const ans=arr[len];return{q:L(TX.next),d:`<div class="math">${arr.slice(0,len).join(', ')}, ❓</div>`,o:near(r,ans,4,Math.max(3,s),0)}}

 else{b=ri(r,1,a-1);c=a-b;q=t(`Ayanın ${a} alması var idi. O, ${b} alma yedi. Neçə alma qaldı?`,`У Аяна было ${a} ${pl(a,'яблоко','яблока','яблок')}. Он съел ${b}. Сколько яблок осталось?`,`Ayan had ${a} apples. He ate ${b}. How many are left?`)}

function weekStart(dt){const d=new Date(dt||Date.now());d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const pad=n=>String(n).padStart(2,'0');
const wkKey=d=>{const m=weekStart(d);return`${m.getFullYear()}-${pad(m.getMonth()+1)}-${pad(m.getDate())}`};
function wkLabel(key){const[y,m,dd]=key.split('-').map(Number);const a=new Date(y,m-1,dd),b=new Date(y,m-1,dd+6);return`${pad(a.getDate())}.${pad(a.getMonth()+1)} – ${pad(b.getDate())}.${pad(b.getMonth()+1)}.${b.getFullYear()}`}
function countdown(){const end=weekStart();end.setDate(end.getDate()+7);let s=Math.max(0,Math.floor((end-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return`${d}${u('dd')} ${h}${u('hh')} ${m}${u('mm')}`}

 for(let i=0;i<10;i++){const c=pick(r,pool);const q=buildQuiz(c,WD[g],1,r,keys)[0];if(q)out.push(q)}return out}

 <div class="cats">${CATS.map(c=>{const st=stars(p,c.id),done=((p.prog&&p.prog[c.id])||[]).filter(x=>x>0).length;return`<button class="cat" onclick="A.go('tower',{c:'${c.id}'})"><span class="ce" style="background:${c.c[0]}22">${c.e}</span><b>${L(c.n)}</b><div class="pb"><i style="width:${done/FLOORS*100}%;background:${c.c[0]}"></i></div><div class="pt">⭐ ${st}</div></button>`}).join('')}</div>
 <div style="height:16px"></div><button class="btn blue block" onclick="A.go('leader')">🥇 ${u('leader')}</button>`};
S.home_after=()=>{window._cdI=setInterval(()=>{const e=document.getElementById('cd');if(e)e.textContent=countdown()},30000)};
S.tower=()=>{const p=me(),c=CAT[ST.p.c],a=(p.prog&&p.prog[c.id])||[];let cur=0;while(cur<FLOORS&&a[cur]>0)cur++;
 let h='';for(let f=FLOORS;f>=1;f--){const s=a[f-1]||0,open=f===1||(a[f-2]||0)>0,isCur=f-1===cur;
  const sub=c.id==='puzzle'?(pzFor(f,grp(p.age)).t==='mem'?'🃏 '+u('memT'):'🖼️ '+u('slideT')):'';
  h+=`<button class="floor ${open?'':'locked'} ${isCur&&open?'cur':''}" onclick="A.floor(${f})"><span class="fn" style="background:linear-gradient(140deg,${c.c[0]},${c.c[1]})">${open?f:'🔒'}</span><span class="fl">${u('floor')} ${f}${sub?`<small>${sub}</small>`:''}</span><span class="fs">${open?'⭐'.repeat(s)+'<span style="opacity:.25">'+'⭐'.repeat(3-s)+'</span>':''}</span></button>`}
 return`<div class="top"><button class="icon-btn" onclick="history.back()">←</button><h1>${c.e} ${L(c.n)}</h1><span class="chip">⭐ ${stars(p,c.id)}/${FLOORS*3}</span></div><div class="tower"><div class="roof">🏰</div>${h}<div class="base"></div></div><div id="fb" class="fb"></div>`};
S.tower_after=()=>{const e=document.querySelector('.floor.cur');if(e)e.scrollIntoView({block:'center'})};
S.quiz=()=>{const q=Q.list[Q.i],n=Q.list.length;const short=q.o.every(o=>o.v.startsWith('<')||o.v.length<=12);const cls=short?(q.o.length===3&&q.o.every(o=>o.v.length<=4||o.v.startsWith('<'))?'g3':'g2'):'';
 return`<div class="qtop"><button class="icon-btn" onclick="history.back()">✕</button><div class="prog">${Q.list.map((_,k)=>`<i class="${k<Q.i?(Q.res[k]?'ok':'no'):k===Q.i?'now':''}"></i>`).join('')}</div><span class="chip">${Q.i+1}/${n}</span></div>
 ${Q.limit?'<div class="timer"><i id="tb"></i></div>':''}
 <div class="card qcard"><div class="qd">${q.d}</div><div class="qq">${q.q}</div></div>
 <div class="opts ${cls}">${q.o.map((o,k)=>`<button class="opt" id="o${k}" onclick="A.ans(${k})">${optH(o.v)}</button>`).join('')}</div><div id="fb" class="fb"></div>`};
S.quiz_after=()=>{Q.answered=false;Q.qStart=Date.now();if(Q.limit){const b=document.getElementById('tb');requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition=`width ${Q.limit}s linear`;b.style.width='0%'}));later(()=>A.ans(-1),Q.limit*1000)}};
function optH(v){if(v.startsWith('<'))return v;if(!/[\p{L}\d]/u.test(v))return`<span class="emo">${v}</span>`;if(/^\d+$/.test(v))return`<span class="num">${v}</span>`;return v}
S.result=()=>{const R=ST.p,c=CAT[R.c];const msg=['res0','res1','res2','res3'][R.s];const next=R.s>0&&R.f<FLOORS;
 return`<div style="height:30px"></div><div class="card res"><div style="font-size:60px">${c.e}</div><div class="big">${[0,1,2].map(i=>`<span style="${i<R.s?'':'opacity:.2;filter:grayscale(1)'}">⭐</span>`).join('')}</div><h2>${u(msg)}</h2>
 <p>${R.pz?`${u('moves')}: ${R.m}`:`${R.k} / ${R.n} ${u('correctN')}`} · ${u('floor')} ${R.f}</p>
 <div class="stack">${next?`<button class="btn green block" onclick="A.floor(${R.f+1},true)">${u('nextF')} ➜</button>`:''}<button class="btn ${next?'ghost':'blue'} block" onclick="A.floor(${R.f},true)">🔄 ${u('retry')}</button><button class="btn ghost block" onclick="history.back()">🏰 ${u('toTower')}</button></div></div>`};
S.result_after=()=>{if(ST.p.s===3){sWin();confetti(90)}else if(ST.p.s>0)confetti(30)};
S.wresult=()=>{const R=ST.p;const g=grp(me().age);const list=wkList(wkKey()).filter(x=>x.g===g);const rank=list.findIndex(x=>x.pid===DB.cur)+1;
 return`<div style="height:30px"></div><div class="card res"><div style="font-size:70px">🏆</div><h2>${u('weekly')}</h2><div style="font-size:44px;font-weight:900;color:var(--blue)">${R.score} <small style="font-size:18px">${u('score')}</small></div>
 <p>${R.k} / ${R.n} ${u('correctN')} · ⏱️ ${R.t}s<br>${u('rank')}: ${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':''} ${rank} (${u('groups')[g]})</p>
 <div class="stack"><button class="btn blue block" onclick="A.go('leader',{},true)">📊 ${u('see')}</button><button class="btn ghost block" onclick="history.back()">🏠 ${u('home')}</button></div></div>`};
S.wresult_after=()=>{sWin();confetti(80)};
function wkList(key){const w=DB.weekly[key]||{};return Object.keys(w).map(pid=>Object.assign({pid},w[pid])).sort((a,b)=>b.score-a.score||a.t-b.t)}
S.leader=()=>{const tab=ST.p.tab||'w';let body='';
 const row=(x,i,val)=>`<div class="lrow ${x.pid===DB.cur?'me':''}"><span class="rk">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><span class="av">${x.avatar}</span><span class="nm">${esc(x.name)}<small>${x.age?x.age+' '+yrs(x.age):''}</small></span><span class="sc">${val}</span></div>`;
 if(tab==='w'){const list=wkList(wkKey());body=`<div class="note" style="margin:0 0 12px">${u('weekOf')}: ${wkLabel(wkKey())} · ⏳ ${countdown()}</div>`+[0,1,2].map(g=>{const l=list.filter(x=>x.g===g);return`<div class="lb-g"><h3>${u('groups')[g]}</h3>${l.length?l.map((x,i)=>row(x,i,x.score)).join(''):`<div class="empty">${u('noRes')}</div>`}</div>`}).join('')}
 else if(tab==='s'){const l=DB.profiles.map(p=>({pid:p.id,name:p.name,avatar:p.avatar,age:p.age,v:totalStars(p)})).sort((a,b)=>b.v-a.v);body=l.map((x,i)=>row(x,i,'⭐ '+x.v)).join('')}
 else{const ks=Object.keys(DB.weekly).filter(k=>k!==wkKey()).sort().reverse();body=ks.length?ks.map(k=>{const l=wkList(k);return`<div class="lb-g"><h3>📅 ${wkLabel(k)}</h3>${[0,1,2].map(g=>{const w=l.find(x=>x.g===g);return w?row(w,0,w.score).replace(/<small>.*?<\/small>/,`<small>${u('groups')[g]}</small>`):''}).join('')}</div>`}).join(''):`<div class="empty">${u('noRes')}</div>`}
 return`<div class="top"><button class="icon-btn" onclick="history.back()">←</button><h1>🥇 ${u('leader')}</h1></div>
 <div class="tabs"><button class="${tab==='w'?'on':''}" onclick="A.ltab('w')">🏆 ${u('thisWeek')}</button><button class="${tab==='s'?'on':''}" onclick="A.ltab('s')">⭐ ${u('starsTab')}</button><button class="${tab==='p'?'on':''}" onclick="A.ltab('p')">📜 ${u('past')}</button></div>
 <div class="card">${body}</div><p class="note" style="color:#fff">${u('deviceNote')}</p>`};
S.settings=()=>{const p=me();return`<div class="top"><button class="icon-btn" onclick="history.back()">←</button><h1>⚙️ ${u('settings')}</h1></div>
 <div class="card"><div style="display:flex;gap:12px;align-items:center;margin-bottom:16px"><span class="av">${p.avatar}</span><div><b style="font-size:20px">${esc(p.name)}</b><br><small style="color:var(--muted);font-weight:700">${p.age} ${yrs(p.age)} · ${u('groups')[grp(p.age)]}</small></div></div>
 <b>${u('lang')}</b><div class="setrow"><div class="seg"><button class="${LANG==='az'?'on':''}" onclick="A.lang('az')">🇦🇿 AZ</button><button class="${LANG==='ru'?'on':''}" onclick="A.lang('ru')">🇷🇺 RU</button><button class="${LANG==='en'?'on':''}" onclick="A.lang('en')">🇬🇧 EN</button></div></div>
 <b>${u('sound')}</b><div class="setrow"><div class="seg"><button class="${DB.sound?'on':''}" onclick="A.snd(true)">🔊 ${u('on')}</button><button class="${!DB.sound?'on':''}" onclick="A.snd(false)">🔇 ${u('off')}</button></div></div>
 <div class="stack"><button class="btn blue block" onclick="A.switchP()">👥 ${u('switchP')}</button><button class="btn red block" id="del" onclick="A.del()">🗑️ ${u('delP')}</button></div>
 <p class="note">${u('ver')} ${VERSION}</p></div>`};
S.mem=()=>{const z=PZS;const cols=z.cards.length<=6?3:4;return`<div class="top"><button class="icon-btn" onclick="history.back()">←</button><h1>🃏 ${u('memT')}</h1><span class="chip">${u('moves')}: <span id="mv">${z.moves}</span></span></div><p class="hint">${u('memH')}</p>
 <div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${z.cards.map((c,i)=>`<button class="mc" id="m${i}" onclick="A.flip(${i})"><div class="in"><div class="f">?</div><div class="b">${c}</div></div></button>`).join('')}</div>`};
S.slide=()=>{const z=PZS;return`<div class="top"><button class="icon-btn" onclick="history.back()">←</button><h1>🖼️ ${u('slideT')}</h1><span class="chip">${u('moves')}: <span id="mv">${z.moves}</span></span></div>
 <div class="pv"><span style="background-image:url(${z.img})"></span>${u('slideH')}</div><div class="slide" id="sb"></div>`};
S.slide_after=()=>{const z=PZS,sb=document.getElementById('sb'),n=z.n;let h='';for(let id=0;id<n*n-1;id++){const r=Math.floor(id/n),c=id%n;h+=`<div class="tile" id="t${id}" onclick="A.slide(${id})" style="width:${100/n}%;height:${100/n}%;background-image:url(${z.img});background-size:${n*100}% ${n*100}%;background-position:${c*100/(n-1)}% ${r*100/(n-1)}%"><b>${id+1}</b></div>`}sb.innerHTML=h;slidePos()};
function slidePos(){const z=PZS,n=z.n;z.pos.forEach((id,p)=>{if(id<0)return;const e=document.getElementById('t'+id);e.style.left=(p%n)*100/n+'%';e.style.top=Math.floor(p/n)*100/n+'%'})}

/* ================= images for slide puzzle ================= */
const IMG=[];
function makeImg(i){if(IMG[i])return IMG[i];const S0=480,cv=document.createElement('canvas');cv.width=cv.height=S0;const x=cv.getContext('2d');
 if(i===0){[AZB,AZR,AZG].forEach((c,k)=>{x.fillStyle=c;x.fillRect(0,k*S0/3,S0,S0/3)});const cx=S0*.46,cy=S0/2,R=S0*.13;x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,R,0,7);x.fill();x.fillStyle=AZR;x.beginPath();x.arc(cx+R*.27,cy,R*.8,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();const sx=cx+R*1.05,sy=cy,ro=R*.42,rin=ro*.5;for(let k=0;k<16;k++){const a=k*Math.PI/8-Math.PI/2,rr=k%2?rin:ro;x.lineTo(sx+rr*Math.cos(a),sy+rr*Math.sin(a))}x.fill()}
 else if(i===1){let g=x.createLinearGradient(0,0,0,S0);g.addColorStop(0,'#6ec6ff');g.addColorStop(1,'#d4f1ff');x.fillStyle=g;x.fillRect(0,0,S0,S0);x.fillStyle='#ffd23f';x.beginPath();x.arc(390,90,48,0,7);x.fill();x.strokeStyle='#ffd23f';x.lineWidth=8;for(let k=0;k<10;k++){const a=k*Math.PI/5;x.beginPath();x.moveTo(390+62*Math.cos(a),90+62*Math.sin(a));x.lineTo(390+82*Math.cos(a),90+82*Math.sin(a));x.stroke()}
  x.fillStyle='#fff';[[90,80],[140,70],[180,85]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,30,0,7);x.fill()});x.fillStyle='#5ec26a';x.fillRect(0,350,S0,130);x.fillStyle='#ffb74d';x.fillRect(150,230,190,140);x.fillStyle='#e53935';x.beginPath();x.moveTo(130,235);x.lineTo(245,140);x.lineTo(360,235);x.fill();
  x.fillStyle='#795548';x.fillRect(220,290,50,80);x.fillStyle='#4fc3f7';x.fillRect(170,260,40,40);x.fillRect(285,260,40,40);x.fillStyle='#6d4c41';x.fillRect(60,260,22,100);x.fillStyle='#2e7d32';x.beginPath();x.arc(71,240,48,0,7);x.fill();x.fillStyle='#ff4081';[[40,420],[120,440],[400,420],[440,450]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,10,0,7);x.fill()})}
 else{x.fillStyle='#bfe9ff';x.fillRect(0,0,S0,S0);const cs=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#3949ab','#8e24aa'];cs.forEach((c,k)=>{x.strokeStyle=c;x.lineWidth=22;x.beginPath();x.arc(240,420,200-k*22,Math.PI,0);x.stroke()});x.fillStyle='#fff';[[60,410],[110,400],[150,420],[330,410],[380,395],[430,420]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,42,0,7);x.fill()});x.fillStyle='#ffd23f';x.beginPath();x.arc(80,80,40,0,7);x.fill()}
 return IMG[i]=cv.toDataURL('image/png')}

/* ================= actions ================= */
const A={
 go:(s,p)=>{sTap();go(s,p)},
 choose(id){DB.cur=id;const p=me();DB.lastLang=p.lang;save();setLang(p.lang);go('home',{},true)},
 regLang(l){REG={lang:l,name:'',age:null,avatar:AVS[0]};DB.lastLang=l;save();go('reg2')},
 regAge(a){REG.age=a;document.querySelectorAll('.ages button').forEach(b=>b.classList.toggle('sel',b.id==='ag'+a));sTap();A.regCheck()},
 regAv(i){REG.avatar=AVS[i];document.querySelectorAll('.avs button').forEach(b=>b.classList.toggle('sel',b.id==='av'+i));sTap()},
 regCheck(){const b=document.getElementById('go');if(b)b.disabled=!((REG.name||'').trim()&&REG.age)},
 regSave(){const p={id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:REG.name.trim().slice(0,16),age:REG.age,avatar:REG.avatar||AVS[0],lang:REG.lang,prog:{},created:Date.now()};DB.profiles.push(p);DB.cur=p.id;DB.lastLang=p.lang;save();confetti(50);sWin();
  let doneNav=false;const fin=()=>{if(doneNav)return;doneNav=true;window._afterPop=null;go('home',{},true)};window._afterPop=fin;try{history.go(-2)}catch(e){fin()}setTimeout(fin,500)},
 floor(f,replace){const p=me(),cat=ST.p.c;if(!CAT[cat])return;const a=(p.prog&&p.prog[cat])||[];
  if(f>1&&!(a[f-2]>0)){const fb=document.getElementById('fb');if(fb){fb.className='fb show no';fb.innerHTML='🔒 '+u('locked');later(()=>fb.className='fb',1500)}sBad();return}
  sTap();const g=grp(p.age);
  if(cat==='puzzle'){const z=pzFor(f,g);if(z.t==='mem'){const pool=shuffle(rnd,['🐶','🐱','🦁','🐼','🐸','🐵','🦊','🐰','🐯','🐨','🐷','🐮','🐔','🦄']).slice(0,z.n);PZS={cat,f,t:'mem',cards:shuffle(rnd,pool.concat(pool)),open:[],done:new Set(),moves:0,lock:false};go('mem',{c:cat},replace);return}
   const n=z.n;let pos=[...Array(n*n-1).keys(),-1],e=n*n-1,prev=-1;for(let k=0;k<z.sh;k++){const nb=[e-n,e+n,(e%n)?e-1:-1,(e%n<n-1)?e+1:-1].filter(x=>x>=0&&x<n*n&&x!==prev);const m=pick(rnd,nb);pos[e]=pos[m];pos[m]=-1;prev=e;e=m}
   if(pos.every((v,i)=>i===n*n-1?v===-1:v===i)){const m=e-1>=0?e-1:e+1;pos[e]=pos[m];pos[m]=-1;e=m}
   PZS={cat,f,t:'slide',n,pos,moves:0,img:makeImg(z.img),sh:z.sh};go('slide',{c:cat},replace);return}
  const d=f+g*4,n=[5,6,7][g];const list=buildQuiz(cat,d,n,rnd);const limit=(g>=1&&f>=6)?(g===1?25:15):0;
  Q={mode:'floor',cat,f,list,i:0,res:[],limit,start:Date.now()};go('quiz',{c:cat},replace)},
 weekly(){if(myWeekly()){go('leader');return}sTap();const g=grp(me().age);Q={mode:'weekly',cat:null,list:buildWeekly(g),i:0,res:[],limit:[0,30,20][g],start:Date.now()};go('quiz',{})},
 ans(k){if(!Q||Q.answered)return;Q.answered=true;clearTimers();const q=Q.list[Q.i];const ci=q.o.findIndex(o=>o.ok);const ok=k===ci;Q.res.push(ok);
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===ci)b.classList.add('ok');else if(i===k)b.classList.add('no');else b.classList.add('dim')});
  const fb=document.getElementById('fb');if(ok){sOk();fb.className='fb show ok';fb.innerHTML='🎉 '+pick(rnd,u('correct'))}
  else{sBad();fb.className='fb show no';fb.innerHTML=(k<0?'⏰ '+u('timeUp'):'😕 '+u('wrong'))+`<small>${u('right')} ${q.o[ci].v.startsWith('<')?'👆':q.o[ci].v}</small>`}
  later(()=>{Q.i++;if(Q.i<Q.list.length){render();window.scrollTo(0,0)}else A.finish()},ok?1000:2000)},
 finish(){const p=me(),k=Q.res.filter(Boolean).length,n=Q.list.length,secs=Math.round((Date.now()-Q.start)/1000);
  if(Q.mode==='weekly'){const score=k*100+Math.max(0,300-secs);const key=wkKey();DB.weekly[key]=DB.weekly[key]||{};DB.weekly[key][p.id]={name:p.name,avatar:p.avatar,age:p.age,g:grp(p.age),score,k,n,t:secs};save();Q=null;go('wresult',{score,k,n,t:secs},true);return}
  const r=k/n,s=r===1?3:r>=.75?2:r>=.5?1:0;saveStars(Q.cat,Q.f,s);const R={c:Q.cat,f:Q.f,s,k,n};Q=null;go('result',R,true)},
 flip(i){const z=PZS;if(z.lock||z.done.has(i)||z.open.includes(i))return;sTap();document.getElementById('m'+i).classList.add('open');z.open.push(i);
  if(z.open.length===2){z.moves++;document.getElementById('mv').textContent=z.moves;const[a,b]=z.open;if(z.cards[a]===z.cards[b]){z.done.add(a);z.done.add(b);z.open=[];later(()=>{sOk();['m'+a,'m'+b].forEach(id=>document.getElementById(id).classList.add('done'))},300);
    if(z.done.size===z.cards.length)later(()=>{const np=z.cards.length/2,s=z.moves<=np+2?3:z.moves<=np*2?2:1;saveStars('puzzle',z.f,s);go('result',{c:'puzzle',f:z.f,s,pz:1,m:z.moves},true)},900)}
   else{z.lock=true;later(()=>{[a,b].forEach(x=>document.getElementById('m'+x).classList.remove('open'));z.open=[];z.lock=false},800)}}},
 slide(id){const z=PZS,n=z.n,p=z.pos.indexOf(id),e=z.pos.indexOf(-1);const adj=(Math.abs(p-e)===n)||(Math.abs(p-e)===1&&Math.floor(p/n)===Math.floor(e/n));if(!adj)return;
  sTap();z.pos[e]=id;z.pos[p]=-1;z.moves++;document.getElementById('mv').textContent=z.moves;slidePos();
  if(z.pos.every((v,i)=>i===n*n-1?v===-1:v===i)){const s=z.moves<=z.sh?3:z.moves<=z.sh*2?2:1;saveStars('puzzle',z.f,s);later(()=>go('result',{c:'puzzle',f:z.f,s,pz:1,m:z.moves},true),500)}},
 ltab(t){ST.p.tab=t;try{history.replaceState({s:ST.s,p:ST.p},'')}catch(e){}render()},
 lang(l){const p=me();p.lang=l;DB.lastLang=l;save();setLang(l);render()},
 snd(v){DB.sound=v;save();render();sTap()},
 switchP(){DB.cur=null;save();go('start',{},true)},
 del(){const b=document.getElementById('del');if(!b.dataset.sure){b.dataset.sure=1;b.textContent='⚠️ '+u('delSure');return}DB.profiles=DB.profiles.filter(p=>p.id!==DB.cur);Object.values(DB.weekly).forEach(w=>delete w[DB.cur]);DB.cur=null;save();go('start',{},true)}
};
function saveStars(cat,f,s){const p=me();p.prog=p.prog||{};p.prog[cat]=p.prog[cat]||[];p.prog[cat][f-1]=Math.max(p.prog[cat][f-1]||0,s);save()}

/* ================= boot ================= */
load();
if(!DB.lastLang){const nl=(navigator.language||'az').slice(0,2);DB.lastLang=['az','ru','en'].includes(nl)?nl:'az'}
ST.s=me()?'home':'start';
try{history.replaceState({s:ST.s,p:{}},'')}catch(e){}
render();
</script>
