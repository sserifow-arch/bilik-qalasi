name: Brainy Kids — APK yığ (Build APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketləri yüklə
        run: npm install

      - name: Testlər
        run: npm test

      - name: Tip yoxlaması (TypeScript)
        run: npm run typecheck

      - name: Veb hissəni yığ
        run: npm run build

      - name: Android layihəsini yarat
        run: |
          npx cap add android
          npx cap sync android

      - name: İkonlar və versiya
        run: |
          node icons/make-icons.cjs
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher.png
            cp icons/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Release APK və AAB yığ
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: İmzala
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            echo "::warning::İmza açarı yoxdur — müvəqqəti açarla imzalanır"
            keytool -genkeypair -keystore release.jks -alias brainykids -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Brainy Kids Test"
            KS_PASS=android; KS_ALIAS=brainykids
          fi
          $BT/zipalign -p -f 4 $APK aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias $KS_ALIAS --out BrainyKids.apk aligned.apk
          $BT/apksigner verify BrainyKids.apk
          jarsigner -keystore release.jks -storepass $KS_PASS -keypass $KS_PASS $AAB $KS_ALIAS
          cp $AAB BrainyKids.aab
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: BrainyKids
          path: |
            BrainyKids.apk
            BrainyKids.aab

      - name: Releases-ə qoy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Brainy Kids v2.0.${{ github.run_number }}
          body: |
            Telefona quraşdırmaq üçün: **BrainyKids.apk**
            Google Play üçün: BrainyKids.aab
          files: |
            BrainyKids.apk
            BrainyKids.aab
          make_latest: true
