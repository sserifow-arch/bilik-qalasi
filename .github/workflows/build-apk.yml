name: Brainy Kids — APK yığ (Build APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test, yığ və imzala
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/ci-build.sh 2>&1 | tee ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: BrainyKids
          path: |
            BrainyKids.apk
            BrainyKids.aab

      - name: Releases-ə qoy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Brainy Kids v2.0.${{ github.run_number }}
          body: |
            Telefona quraşdırmaq üçün: **BrainyKids.apk**
            Google Play üçün: BrainyKids.aab
          files: |
            BrainyKids.apk
            BrainyKids.aab
          make_latest: true

      - name: Jurnalı saxla (ci-logs budağı)
        if: always()
        run: |
          mkdir -p /tmp/log && cp ci.log /tmp/log/ci.log 2>/dev/null || echo "jurnal yoxdur" > /tmp/log/ci.log
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > /tmp/log/status.txt
          tail -c 60000 /tmp/log/ci.log > /tmp/log/tail.log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rqf . || true
          cp /tmp/log/status.txt /tmp/log/tail.log .
          git add status.txt tail.log
          git commit -qm "CI log ${{ github.run_number }}"
          git push -qf origin ci-logs
